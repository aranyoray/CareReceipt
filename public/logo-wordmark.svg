  <rect width="268" height="72" rx="16" fill="#124045"/>
  <g transform="translate(16 4)">
    <path d="M20 15a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v30l-3 6-3-6-3 6-3-6-3 6-3-6-3 6-3-6z" fill="#ffffff"/>
    <rect x="25" y="19" width="14" height="3" rx="1.5" fill="#124045" opacity=".75"/>
    <rect x="25" y="25" width="9" height="3" rx="1.5" fill="#124045" opacity=".4"/>
    <rect x="25" y="31" width="14" height="3.4" rx="1.7" fill="#b3392a"/>
    <rect x="30" y="37.6" width="9" height="3" rx="1.5" fill="#124045" opacity=".28"/>
